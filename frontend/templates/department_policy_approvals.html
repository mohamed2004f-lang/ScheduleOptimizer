<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>اعتماد سياسات الأقسام</title>
  <link href="/static/vendor/bootstrap/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  {% include "base_nav.html" %}
  <main class="container-main container-1100">
    <div class="page-header mb-3">
      <div>
        <h1 class="page-title">اعتماد سياسات نظم التخرج</h1>
        <p class="page-subtitle">عميد الكلية ومسؤول النظام: مراجعة واعتماد أو رفض مقترحات رؤساء الأقسام</p>
      </div>
    </div>

    <div id="msgBox" class="mb-2"></div>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <strong>الطلبات قيد المراجعة</strong>
        <button id="btnReload" class="btn btn-sm btn-outline-primary">تحديث</button>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-sm table-bordered">
            <thead>
              <tr>
                <th>المعرف</th>
                <th>القسم</th>
                <th>النظام</th>
                <th>الوحدات</th>
                <th>السريان من</th>
                <th>ملاحظة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="rowsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    function showMsg(text, kind='info'){
      const box = document.getElementById('msgBox');
      if(!box) return;
      box.innerHTML = text ? `<div class="alert alert-${kind} py-1 px-2 mb-0">${text}</div>` : '';
    }

    function escapeHtml(value){
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderEmpty(body, text){
      body.innerHTML = `<tr><td colspan="7" class="text-center text-muted">${escapeHtml(text)}</td></tr>`;
    }

    async function loadRows(){
      const body = document.getElementById('rowsBody');
      if(!body) return;
      showMsg('جارٍ تحميل الطلبات قيد المراجعة...', 'info');
      try {
        const j = await apiGet('/department_policies/admin/pending');
        const items = (j && j.items) || [];
        body.innerHTML = '';
        if(!items.length){
          renderEmpty(body, 'لا توجد طلبات قيد المراجعة حالياً.');
          showMsg('لا توجد طلبات قيد المراجعة حالياً.', 'info');
          return;
        }
        items.forEach(it=>{
          const effFrom = [it.effective_from_term || '', it.effective_from_year || ''].filter(Boolean).join(' ') || 'فوري';
          body.insertAdjacentHTML(
            'beforeend',
            `<tr>
              <td>${escapeHtml(it.id)}</td>
              <td>${escapeHtml(it.department_code || '')} — ${escapeHtml(it.department_name_ar || '')}</td>
              <td>${escapeHtml(it.plan_code || '')}</td>
              <td>${escapeHtml(it.min_total_units || 0)}</td>
              <td>${escapeHtml(effFrom)}</td>
              <td>${escapeHtml(it.notes || '')}</td>
              <td>
                <button class="btn btn-sm btn-success btn-approve" data-id="${escapeHtml(it.id)}">اعتماد</button>
                <button class="btn btn-sm btn-primary btn-approve-now" data-id="${escapeHtml(it.id)}">اعتماد وتفعيل الآن</button>
                <button class="btn btn-sm btn-danger btn-reject" data-id="${escapeHtml(it.id)}">رفض</button>
              </td>
            </tr>`
          );
        });
        showMsg(`تم تحميل ${items.length} طلب/طلبات قيد المراجعة.`, 'success');

        body.querySelectorAll('.btn-approve').forEach(btn=>{
          btn.addEventListener('click', () => decidePolicy(btn.dataset.id, 'approve', false));
        });
        body.querySelectorAll('.btn-approve-now').forEach(btn=>{
          btn.addEventListener('click', () => decidePolicy(btn.dataset.id, 'approve', true));
        });
        body.querySelectorAll('.btn-reject').forEach(btn=>{
          btn.addEventListener('click', () => decidePolicy(btn.dataset.id, 'reject'));
        });
      } catch (e) {
        console.error(e);
        renderEmpty(body, 'تعذر تحميل الطلبات.');
        showMsg((e && e.message) ? e.message : 'تعذر تحميل الطلبات', 'danger');
      }
    }

    async function decidePolicy(id, action, activateNow){
      if(!id) return;
      try {
        if(action === 'reject'){
          const reason = prompt('سبب الرفض (اختياري):', '') || '';
          await apiPost(`/department_policies/admin/reject/${encodeURIComponent(id)}`, { reason: reason.trim() });
          showMsg('تم رفض السياسة', 'warning');
        } else {
          await apiPost(`/department_policies/admin/approve/${encodeURIComponent(id)}`, { activate_now: !!activateNow });
          showMsg(activateNow ? 'تم اعتماد السياسة وتفعيلها على الفصل الحالي' : 'تم اعتماد السياسة بنجاح', 'success');
        }
        loadRows();
      } catch (e) {
        console.error(e);
        showMsg((e && e.message) ? e.message : 'فشل تنفيذ الإجراء', 'danger');
      }
    }

    document.getElementById('btnReload').addEventListener('click', loadRows);
    window.addEventListener('DOMContentLoaded', loadRows);
  </script>
</body>
</html>
