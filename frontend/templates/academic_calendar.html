<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>التقويم الأكاديمي</title>
  <link href="/static/vendor/bootstrap/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  {% include "base_nav.html" %}
  <main class="container-main container-1100 theme-formal">
    <div class="page-header">
      <div>
        <h1 class="page-title">التقويم الأكاديمي</h1>
        <p class="page-subtitle" id="pageSubtitle">تحديد تواريخ الخطة الدراسية للفصل الحالي والفصول الماضية حسب العام الجامعي</p>
      </div>
      <div class="d-flex gap-2">
        <a href="/" class="btn btn-outline-secondary btn-sm">العودة</a>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label">العام الجامعي</label>
            <input id="academicYear" class="form-control form-control-sm" placeholder="مثال: 2025/2026" />
            <div class="form-text">اكتب العام هكذا: 2026/2027 (شرط مائل). بنود «لمدة أسبوع» لها تاريخ بداية ونهاية.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">الفصل الدراسي</label>
            <select id="termSelect" class="form-select form-select-sm">
              <option value="fall">فصل الخريف</option>
              <option value="spring">فصل الربيع</option>
            </select>
          </div>
          <div class="col-md-4 d-flex gap-2">
            <button id="btnLoad" class="btn btn-outline-primary btn-sm w-100">تحميل</button>
            <button id="btnAddTitle" class="btn btn-outline-secondary btn-sm w-100">إضافة عنوان</button>
            <button id="btnSave" class="btn btn-primary btn-sm w-100">حفظ</button>
          </div>
        </div>
        <div id="msg" class="mt-2"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-sm table-bordered align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width:70px" class="text-center">رقم</th>
                <th>العنوان حسب الخطة الدراسية</th>
                <th style="width:160px" class="text-center">من</th>
                <th style="width:160px" class="text-center">إلى</th>
              </tr>
            </thead>
            <tbody id="calendarBody"></tbody>
          </table>
        </div>
        <div class="small text-muted mt-2" id="lastUpdated"></div>
      </div>
    </div>
  </main>

  <script>
    function csrfToken(){
      return document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
    }
    function requestHeaders(extra){
      const h = Object.assign({
        'Accept': 'application/json',
        'X-Requested-With': 'XMLHttpRequest'
      }, extra || {});
      const t = csrfToken();
      if (t) h['X-CSRFToken'] = t;
      return h;
    }
    async function fetchJSON(url, opts){
      opts = opts || {};
      const headers = requestHeaders(opts.headers || {});
      const r = await fetch(url, Object.assign({ credentials: 'same-origin' }, opts, { headers }));
      const j = await r.json().catch(()=>null);
      return {ok:r.ok,status:r.status,json:j};
    }
    function apiErr(r){
      const j = r.json || {};
      if (j.error === 'CSRF_FAILED') {
        return j.message || 'انتهت صلاحية الحماية الأمنية. حدّث الصفحة ثم احفظ مرة أخرى.';
      }
      return j.message || j.error || ('فشل الطلب (رمز ' + r.status + ')');
    }
    function setMsg(kind, text){
      const el = document.getElementById('msg');
      el.innerHTML = text ? `<div class="alert alert-${kind} p-2 mb-0">${text}</div>` : '';
    }

    let CURRENT = { academic_year: null, term: null, items: [] };
    let CURRENT_ROLE = null;

    function canEditCalendar(role){
      return ['admin','admin_main','system_admin','college_dean','academic_vice_dean'].includes(role || '');
    }

    function guessAcademicYear(){
      const d = new Date();
      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      // تقدير بسيط: إذا بعد سبتمبر نعتبر بداية عام جديد
      const start = (m >= 9) ? y : (y - 1);
      return `${start}/${start + 1}`;
    }

    function dayVal(v){ return String(v || '').substring(0,10); }
    function needsRange(it){
      return !!(it && (it.needs_range || /لمدة/.test(it.title || '')));
    }
    function durationDays(title){
      const t = title || '';
      if (/ثلاثة أيام/.test(t)) return 3;
      if (/يومين/.test(t)) return 2;
      if (/أسبوع/.test(t)) return 7;
      return 0;
    }
    function shiftDays(iso, days){
      if (!iso) return '';
      const d = new Date(iso + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return '';
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0,10);
    }

    function render(items){
      const body = document.getElementById('calendarBody');
      body.innerHTML = '';
      (items || []).forEach(it=>{
        const tr = document.createElement('tr');
        tr.dataset.no = String(it.item_no);
        const titleCell = canEditCalendar(CURRENT_ROLE)
          ? `<input type="text" class="form-control form-control-sm cal-title" data-no="${it.item_no}" value="${(it.title || '').replace(/\"/g,'&quot;')}" />`
          : `<div>${it.title || ''}</div>`;
        const canEdit = canEditCalendar(CURRENT_ROLE);
        const btnDel = canEdit
          ? `<button type="button" class="btn btn-sm ${it.is_custom ? 'btn-outline-danger' : 'btn-outline-warning'} cal-del" data-no="${it.item_no}" data-custom="${it.is_custom ? '1':'0'}">حذف</button>`
          : '';
        const range = needsRange(it);
        const startVal = dayVal(it.event_date_start);
        const endVal = dayVal(it.event_date);
        const startCell = range
          ? `<input type="date" class="form-control form-control-sm cal-start" dir="ltr" data-no="${it.item_no}" value="${startVal}" ${canEdit ? '' : 'disabled'} />`
          : `<span class="text-muted small">موعد</span>`;
        tr.innerHTML = `
          <td class="text-center">${it.item_no}</td>
          <td>
            <div class="d-flex gap-2 align-items-center">
              <div class="flex-grow-1">${titleCell}</div>
              ${btnDel}
            </div>
          </td>
          <td class="text-center">${startCell}</td>
          <td class="text-center">
            <input type="date" class="form-control form-control-sm cal-date" dir="ltr" data-no="${it.item_no}" value="${endVal}" ${canEdit ? '' : 'disabled'} />
          </td>
        `;
        body.appendChild(tr);
      });

      if (canEditCalendar(CURRENT_ROLE)) {
        body.querySelectorAll('.cal-date').forEach(inp=>{
          inp.addEventListener('change', ()=>{
            const tr = inp.closest('tr');
            const start = tr && tr.querySelector('.cal-start');
            const titleInp = tr && tr.querySelector('.cal-title');
            const days = durationDays(titleInp ? titleInp.value : '');
            if (start && days && inp.value && !start.value) start.value = shiftDays(inp.value, -(days - 1));
          });
        });
        body.querySelectorAll('.cal-del').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            // "حذف" هنا يعني إخفاء العنصر من هذا العام/الفصل (is_deleted=1)
            const no = Number(btn.dataset.no);
            const isCustom = btn.dataset.custom === '1';
            if (!confirm(isCustom ? 'هل تريد حذف هذا العنوان المضاف؟' : 'هل تريد حذف/إخفاء هذا العنوان من التقويم لهذا العام والفصل؟')) return;
            const row = btn.closest('tr');
            if (row) row.remove();
            // نحفظ علامة الحذف في CURRENT.items ليرسلها الحفظ
            const idx = CURRENT.items.findIndex(x=>Number(x.item_no) === no);
            if (idx >= 0) CURRENT.items[idx].is_deleted = 1;
          });
        });
      }
    }

    async function loadCalendar(){
      const year = document.getElementById('academicYear').value.trim();
      const term = document.getElementById('termSelect').value;
      if(!year){ setMsg('warning','أدخل العام الجامعي أولاً.'); return; }
      setMsg('info','جاري التحميل...');
      const r = await fetchJSON(`/academic_calendar/items?academic_year=${encodeURIComponent(year)}&term=${encodeURIComponent(term)}`);
      if(!r.ok){ setMsg('danger', apiErr(r)); return; }
      if (r.json.academic_year) document.getElementById('academicYear').value = r.json.academic_year;
      CURRENT = { academic_year: r.json.academic_year, term: r.json.term, items: r.json.items || [] };
      render(CURRENT.items);
      document.getElementById('lastUpdated').textContent = '';
      const dated = (CURRENT.items || []).filter(x => x.event_date || x.event_date_start).length;
      const yearShown = r.json.academic_year || year;
      const label = (term === 'fall' ? 'خريف' : 'ربيع') + ' ' + yearShown;
      if (!dated) {
        setMsg('warning', 'تم تحميل ' + label + ' بلا تواريخ. إن كنت حفظت خريفاً آخر فغيّر العام/الفصل ثم اضغط تحميل، أو عيّن الفصل الحالي من لوحة التشغيل.');
      } else {
        setMsg('success','تم تحميل ' + label + ' (' + dated + ' تاريخ).');
      }
    }

    async function saveCalendar(){
      if(!canEditCalendar(CURRENT_ROLE)){
        setMsg('warning','صلاحية حفظ التواريخ غير متاحة لهذا الدور.');
        return;
      }
      const year = document.getElementById('academicYear').value.trim();
      const term = document.getElementById('termSelect').value;
      if(!year){ setMsg('warning','أدخل العام الجامعي أولاً.'); return; }

      const rows = Array.from(document.querySelectorAll('#calendarBody tr'));
      const payloadItems = rows.map(tr=>{
        const no = Number(tr.dataset.no || (tr.querySelector('.cal-date')||{}).dataset?.no || 0);
        const dateVal = (tr.querySelector('.cal-date')||{}).value || null;
        const startVal = (tr.querySelector('.cal-start')||{}).value || null;
        const titleInp = tr.querySelector('.cal-title');
        const titleVal = titleInp ? (titleInp.value || '') : '';
        return { item_no: no, title: titleVal, event_date: dateVal, event_date_start: startVal, is_deleted: 0 };
      });
      (CURRENT.items || []).forEach(it=>{
        if (it && it.is_deleted) payloadItems.push({ item_no: it.item_no, title: it.title || '', event_date: it.event_date || null, is_deleted: 1 });
      });
      setMsg('info','جاري الحفظ...');
      const r = await fetchJSON('/academic_calendar/items', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ academic_year: year, term, items: payloadItems })
      });
      if(!r.ok){ setMsg('danger', apiErr(r)); return; }
      const savedYear = r.json?.academic_year || year;
      const savedTerm = r.json?.term || term;
      if (r.json?.academic_year) document.getElementById('academicYear').value = r.json.academic_year;
      const items = Array.isArray(r.json?.items) ? r.json.items : null;
      if (items) {
        CURRENT = { academic_year: savedYear, term: savedTerm, items };
        render(items);
      }
      const dated = (items || payloadItems).filter(x => !x.is_deleted && (x.event_date || x.event_date_start)).length;
      setMsg('success', r.json?.message || ('تم الحفظ' + (dated ? ' (' + dated + ' تاريخ).' : '.')));
      if (r.json?.updated_at) document.getElementById('lastUpdated').textContent = `آخر حفظ: ${r.json.updated_at}`;
    }

    function mapTermNameToCalendar(termName){
      const t = (termName || '').trim();
      if (/ربيع/i.test(t)) return 'spring';
      if (/خريف/i.test(t)) return 'fall';
      return 'fall';
    }

    function mapTermYearToAcademicYear(termYear){
      const y = (termYear || '').trim();
      const m = y.match(/(\d{2})\s*[-–]\s*(\d{2})/);
      if (m) return `20${m[1]}/20${m[2]}`;
      const m2 = y.match(/(20\d{2})\s*[/\-]\s*(20\d{2})/);
      if (m2) return `${m2[1]}/${m2[2]}`;
      return guessAcademicYear();
    }

    async function applyCurrentTermDefaults(){
      try {
        const r = await fetchJSON('/admin/settings/current_term');
        if (!r.ok || !r.json) return;
        const tn = r.json.term_name || '';
        const ty = r.json.term_year || '';
        if (ty) document.getElementById('academicYear').value = mapTermYearToAcademicYear(ty);
        if (tn) document.getElementById('termSelect').value = mapTermNameToCalendar(tn);
      } catch (_e) { /* ignore */ }
    }

    document.addEventListener('DOMContentLoaded', async ()=>{
      let isStudent = false;
      try {
        const auth = await fetchJSON('/auth/check');
        CURRENT_ROLE = auth.ok ? auth.json?.role : null;
        isStudent = CURRENT_ROLE === 'student' || !!(auth.json?.capabilities?.is_student);
      } catch(e) {
        CURRENT_ROLE = null;
      }

      if (isStudent) {
        const sub = document.getElementById('pageSubtitle');
        if (sub) sub.textContent = 'عرض التقويم الأكاديمي للفصل الحالي (قراءة فقط)';
        document.getElementById('btnAddTitle').style.display = 'none';
        document.getElementById('btnSave').style.display = 'none';
        document.getElementById('academicYear').readOnly = true;
        document.getElementById('termSelect').disabled = true;
      } else {
        document.getElementById('academicYear').value = guessAcademicYear();
      }

      await applyCurrentTermDefaults();

      document.getElementById('btnLoad').addEventListener('click', loadCalendar);
      document.getElementById('btnSave').addEventListener('click', saveCalendar);
      const btnAdd = document.getElementById('btnAddTitle');
      if (btnAdd) {
        btnAdd.addEventListener('click', ()=>{
          if (!canEditCalendar(CURRENT_ROLE)) return;
          CURRENT.items = Array.isArray(CURRENT.items) ? CURRENT.items : [];
          CURRENT.items.push({ item_no: 0, title: '', event_date: null, is_custom: true, is_deleted: 0 });
          render(CURRENT.items.filter(x=>!x.is_deleted));
          setMsg('info','أضفت صف عنوان جديد. اكتب العنوان ثم اضغط حفظ.');
        });
      }

      await loadCalendar();
      if (!canEditCalendar(CURRENT_ROLE) && !isStudent){
        document.getElementById('btnSave').disabled = true;
        document.getElementById('btnSave').title = 'متاح لإدارة الكلية';
      }
    });
  </script>

</body>
</html>
