<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>التحقق بخطوتين</title>
  <link href="/static/vendor/bootstrap/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">التحقق بخطوتين</h1>
    <p class="auth-subtitle">أدخل الرمز المكوّن من 6 أرقام من تطبيق المصادقة</p>
    <div id="msg" class="mb-3"></div>
    <div class="mb-3">
      <label class="form-label" for="mfaCode">رمز التحقق</label>
      <input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" class="form-control" placeholder="000000">
    </div>
    <button id="btnVerify" type="button" class="btn btn-primary w-100">تأكيد</button>
    <div class="mt-3 text-center">
      <a href="/logout">إلغاء والعودة لتسجيل الدخول</a>
    </div>
  </div>
  <script src="/static/js/common.js"></script>
  <script nonce="{{ csp_nonce }}">
    function setMsg(kind, text){
      document.getElementById('msg').innerHTML = text ? `<div class="alert alert-${kind} p-2 mb-0">${text}</div>` : '';
    }
    async function submitCode(){
      const code = (document.getElementById('mfaCode').value || '').trim();
      if(code.length < 6){
        setMsg('warning', 'أدخل رمز التحقق المكوّن من 6 أرقام.');
        return;
      }
      const r = await fetch('/auth/mfa/verify', {
        method: 'POST',
        credentials: 'include',
        headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
        body: JSON.stringify({code})
      });
      const j = await r.json().catch(() => null);
      if(r.ok && j && j.status === 'ok'){
        window.location.href = '/dashboard?logged_in=1';
        return;
      }
      if(r.redirected){
        window.location.href = r.url;
        return;
      }
      setMsg('danger', (j && j.message) || 'رمز التحقق غير صحيح');
    }
    document.getElementById('btnVerify').addEventListener('click', submitCode);
    document.getElementById('mfaCode').addEventListener('keydown', function(ev){
      if(ev.key === 'Enter'){ submitCode(); }
    });
  </script>
</body>
</html>
