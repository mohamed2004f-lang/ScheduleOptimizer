<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>تغيير كلمة المرور</title>
  <link href="/static/vendor/bootstrap/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  {% include "base_nav.html" %}
  <main class="container-main container-700">
    <div class="page-header">
      <div>
        <h1 class="page-title">تغيير كلمة المرور</h1>
        <p class="page-subtitle">أدخل كلمة المرور الحالية ثم الكلمة الجديدة (8 أحرف على الأقل)</p>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div id="msg" class="mb-2"></div>
        <div class="mb-2">
          <label class="form-label" for="pwCurrent">كلمة المرور الحالية</label>
          <input id="pwCurrent" type="password" class="form-control" autocomplete="current-password">
        </div>
        <div class="mb-2">
          <label class="form-label" for="pw1">كلمة المرور الجديدة</label>
          <input id="pw1" type="password" class="form-control" autocomplete="new-password" minlength="8">
        </div>
        <div class="mb-3">
          <label class="form-label" for="pw2">تأكيد كلمة المرور الجديدة</label>
          <input id="pw2" type="password" class="form-control" autocomplete="new-password" minlength="8">
        </div>
        <button id="btnSet" type="button" class="btn btn-primary">حفظ</button>
      </div>
    </div>
  </main>
  <script src="/static/js/common.js"></script>
  <script>
    function setMsg(kind, text){
      document.getElementById('msg').innerHTML = text ? `<div class="alert alert-${kind} p-2 mb-0">${text}</div>` : '';
    }
    async function submitPw(){
      const current = document.getElementById('pwCurrent').value || '';
      const p1 = document.getElementById('pw1').value || '';
      const p2 = document.getElementById('pw2').value || '';
      if(!current){
        setMsg('warning','كلمة المرور الحالية مطلوبة.');
        return;
      }
      if(p1.length < 8){
        setMsg('warning','كلمة المرور يجب ألا تقل عن 8 أحرف.');
        return;
      }
      if(p1 !== p2){
        setMsg('warning','كلمتا المرور غير متطابقتين.');
        return;
      }
      const r = await fetch('/auth/change_password', {
        method: 'POST',
        credentials: 'include',
        headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
        body: JSON.stringify({
          current_password: current,
          new_password: p1,
          confirm_password: p2
        })
      });
      const j = await r.json().catch(() => null);
      if(r.ok){
        setMsg('success', j?.message || 'تم تغيير كلمة المرور بنجاح');
        document.getElementById('pwCurrent').value = '';
        document.getElementById('pw1').value = '';
        document.getElementById('pw2').value = '';
      } else {
        setMsg('danger', j?.message || 'فشل الحفظ');
      }
    }
    document.getElementById('btnSet').addEventListener('click', submitPw);
  </script>
</body>
</html>
