<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>مراجعة التسجيل (أسبقية ووحدات)</title>
  <link href="/static/vendor/bootstrap/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
{% include "base_nav.html" %}

<main class="container-main container-1100">
  <div class="page-header">
    <div>
      <h1 class="page-title">مراجعة التسجيل — أسبقية ووحدات</h1>
      <p class="page-subtitle">حالات المتطلب السابق في التسجيل الفعلي، وطلبة خارج نطاق الحمل 12–18 وحدة</p>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-outline-secondary btn-sm" href="/department_reports">لوحة التقارير</a>
      <a class="btn btn-outline-success btn-sm" id="btnExcel" href="#">تصدير Excel</a>
      <a class="btn btn-outline-danger btn-sm" id="btnPdf" href="#" target="_blank">تصدير PDF</a>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-md-2">
          <label class="form-label small" for="fltGroup">المجموعة</label>
          <select id="fltGroup" class="form-select form-select-sm">
            <option value="all">الكل</option>
            <option value="prereq">الأسبقية فقط</option>
            <option value="load">الوحدات فقط</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small" for="fltKind">التصنيف</label>
          <select id="fltKind" class="form-select form-select-sm">
            <option value="">الكل</option>
            <optgroup label="حمل الوحدات">
              <option value="load_under_12">أقل من 12 وحدة</option>
              <option value="load_over_18">أكثر من 18 وحدة</option>
            </optgroup>
            <optgroup label="الأسبقية">
              <option value="coregister_new">متطلب + تابع معاً (أول مرة)</option>
              <option value="coregister_retry">إعادة متطلب راسب + تابع</option>
              <option value="failed_not_retaking">تابع مسجّل ومتطلب راسب وغير معاد</option>
              <option value="missing">تابع مسجّل ومتطلب مفقود</option>
              <option value="in_progress">متطلب مسجّل دون درجة نهائية</option>
              <option value="no_grade">متطلب في الكشف بلا درجة</option>
            </optgroup>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label small" for="fltDependent">المقرر التابع</label>
          <input id="fltDependent" class="form-control form-control-sm" placeholder="جزء من الاسم">
        </div>
        <div class="col-md-3">
          <label class="form-label small" for="fltPrereq">المتطلب السابق</label>
          <input id="fltPrereq" class="form-control form-control-sm" placeholder="جزء من الاسم">
        </div>
        <div class="col-md-2">
          <button type="button" class="btn btn-primary btn-sm w-100" id="btnLoad">تحديث</button>
        </div>
      </div>
      <div id="msg" class="mt-2"></div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body py-3">
      <div class="row g-3 small" id="summaryBoxes">
        <div class="col-md-3">
          <span class="text-muted">إجمالي الصفوف</span>
          <div class="fw-bold fs-5" id="sumTotal">—</div>
        </div>
        <div class="col-md-3">
          <span class="text-muted">عدد الطلبة</span>
          <div class="fw-bold fs-5" id="sumStudents">—</div>
        </div>
        <div class="col-md-6">
          <span class="text-muted">حسب التصنيف</span>
          <div class="small" id="sumByKind">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-sm table-bordered mb-0" id="tbl">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>رقم الطالب</th>
              <th>الاسم</th>
              <th class="text-center">الوحدات</th>
              <th>المقرر التابع</th>
              <th>المتطلب السابق</th>
              <th class="text-center">درجة المتطلب</th>
              <th>التصنيف</th>
              <th>الوصف</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
async function fetchJSON(url, opts){
  const r = await fetch(url, { credentials: 'include', ...opts });
  const j = await r.json().catch(() => null);
  return { ok: r.ok, status: r.status, json: j };
}
function esc(s){
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
function setMsg(kind, text){
  const el = document.getElementById('msg');
  const safe = (kind === 'danger' || kind === 'success' || kind === 'warning' || kind === 'info') ? kind : 'info';
  el.innerHTML = text ? `<div class="alert alert-${safe} p-2 mb-0">${esc(text)}</div>` : '';
}
function buildParams(){
  const p = new URLSearchParams();
  const group = (document.getElementById('fltGroup').value || 'all').trim();
  const kind = (document.getElementById('fltKind').value || '').trim();
  const dep = (document.getElementById('fltDependent').value || '').trim();
  const pre = (document.getElementById('fltPrereq').value || '').trim();
  if (group && group !== 'all') p.set('group', group);
  if (kind) p.set('kind', kind);
  if (dep) p.set('course_name', dep);
  if (pre) p.set('prereq', pre);
  return p;
}
function kindBadgeClass(kind){
  if (kind === 'missing') return 'bg-danger';
  if (kind === 'failed_not_retaking') return 'bg-warning text-dark';
  if (kind === 'load_under_12') return 'bg-info text-dark';
  if (kind === 'load_over_18') return 'bg-warning text-dark';
  if (kind === 'coregister_retry') return 'bg-info text-dark';
  if (kind === 'coregister_new' || kind === 'in_progress') return 'bg-primary';
  return 'bg-secondary';
}
function fmtUnits(v){
  if (v == null || v === '') return '—';
  const n = Number(v);
  return Number.isFinite(n) ? String(n) : esc(v);
}

async function load(){
  const p = buildParams();
  const qs = p.toString();
  const base = '/students/registration_review_report';
  document.getElementById('btnExcel').href = base + '/excel' + (qs ? ('?' + qs) : '');
  document.getElementById('btnPdf').href = base + '/pdf' + (qs ? ('?' + qs) : '');
  setMsg('info', 'جاري التحميل...');
  const r = await fetchJSON(base + (qs ? ('?' + qs) : ''));
  const tb = document.querySelector('#tbl tbody');
  tb.innerHTML = '';
  if (!r.ok) {
    setMsg('danger', (r.json && r.json.message) || 'فشل تحميل التقرير');
    document.getElementById('sumTotal').textContent = '—';
    document.getElementById('sumStudents').textContent = '—';
    document.getElementById('sumByKind').textContent = '—';
    return;
  }
  const items = (r.json && r.json.items) || [];
  const summary = (r.json && r.json.summary) || {};
  document.getElementById('sumTotal').textContent = String(summary.total != null ? summary.total : items.length);
  document.getElementById('sumStudents').textContent = String(summary.students != null ? summary.students : '—');
  const byKind = summary.by_kind || {};
  const labels = summary.kind_labels || {};
  const parts = Object.keys(byKind).sort().map(k => `${esc(labels[k] || k)}: <strong>${esc(byKind[k])}</strong>`);
  document.getElementById('sumByKind').innerHTML = parts.length ? parts.join(' · ') : '—';
  if (!items.length) {
    setMsg('success', 'لا توجد حالات ضمن الفلتر الحالي.');
    tb.innerHTML = '<tr><td colspan="9" class="text-center text-muted">لا توجد بيانات</td></tr>';
    return;
  }
  setMsg('', '');
  items.forEach((it, idx) => {
    const tr = document.createElement('tr');
    const grade = it.prereq_grade != null && it.prereq_grade !== '' ? it.prereq_grade : '—';
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td>${esc(it.student_id || '')}</td>
      <td>${esc(it.student_name || '')}</td>
      <td class="text-center">${fmtUnits(it.total_units)}</td>
      <td>${esc(it.dependent_course || '—')}</td>
      <td>${esc(it.prereq_course || '—')}</td>
      <td class="text-center">${esc(grade)}</td>
      <td><span class="badge ${kindBadgeClass(it.kind)}">${esc(it.kind_label_ar || it.kind || '')}</span></td>
      <td class="small">${esc(it.label_ar || '')}</td>
    `;
    tb.appendChild(tr);
  });
}

document.getElementById('btnLoad').addEventListener('click', () => load());
['fltGroup', 'fltKind', 'fltDependent', 'fltPrereq'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') load();
  });
});
load();
</script>
</body>
</html>
